services:
  - type: web
    name: studentsphere-api
    runtime: node
    plan: starter
    rootDir: studentsphere
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

    disk:
      name: studentsphere-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
